  <body class="calibre"><h1 class="calibre1">Floats first</h1><p class="calibre3"><img class="fl" src="p.png" alt="left"/>Words beside the picture.</p><p class="calibre3"><img class="fl" src="p.png" alt="left"/> <img class="fr" src="p.png" alt="right"/> Words <i class="calibre9">between</i> both, <span id="mid">an id</span> in them.</p><p id="whole" class="calibre3"><img class="fr" src="p.png" alt="right"/>Its own id.</p><p class="calibre3">The boats went out past the harbour wall, and the quay watched them go.</p><p class="calibre3"><a href="c5.xhtml#mid">To the id</a>, <a href="c5.xhtml#whole">to the paragraph</a>.</p></body></html>
