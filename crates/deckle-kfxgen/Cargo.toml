[package]
name = "deckle-kfxgen"
description = "EPUB → KFX without Kindle Previewer: a Rust port of kfxgen"
version.workspace = true
edition.workspace = true
# kfxgen, which this ports, is GPL v3 only (NOTICE).
license = "GPL-3.0-only"
repository.workspace = true

[dependencies]
deckle-kfx.workspace = true
deckle-limits = { workspace = true, features = ["xml"] }
roxmltree.workspace = true
html5ever.workspace = true
cssparser.workspace = true
selectors.workspace = true
zip.workspace = true
regex.workspace = true
# float_roundtrip: without it serde_json reads some floats one ULP off kfxgen's.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
deckle-kfx = { workspace = true, features = ["testing"] }
tempfile.workspace = true
