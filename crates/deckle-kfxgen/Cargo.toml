[package]
name = "deckle-kfxgen"
description = "EPUB → KFX without Kindle Previewer: a Rust port of kfxgen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
deckle-kfx.workspace = true
regex.workspace = true
# float_roundtrip: without it serde_json reads some floats one ULP off kfxgen's.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
