[package]
name = "deckle-kfxgen"
description = "EPUB → KFX without Kindle Previewer: a Rust port of kfxgen"
version.workspace = true
edition.workspace = true
# kfxgen, which this ports, is GPL v3 only (NOTICE).
license = "GPL-3.0-only"
repository.workspace = true

[dependencies]
deckle-kfx.workspace = true
deckle-limits = { workspace = true, features = ["xml"] }
roxmltree.workspace = true
html5ever.workspace = true
# Encodings a document declares (src/dom/parse.rs).
encoding_rs.workspace = true
cssparser.workspace = true
selectors.workspace = true
# The hash `selectors` asks its names for (src/css/select.rs).
precomputed-hash.workspace = true
zip.workspace = true
regex.workspace = true
# float_roundtrip: without it serde_json reads some floats one ULP off kfxgen's.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
# Dates as Calibre reads them (src/epub/package.rs).
chrono = { version = "0.4", default-features = false }
thiserror.workspace = true

[dev-dependencies]
deckle-kfx = { workspace = true, features = ["testing"] }
# The dumps' declarations in their written order (tests/it/css_sheet.rs).
serde.workspace = true
tempfile.workspace = true
